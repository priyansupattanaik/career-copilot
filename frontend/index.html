<!doctype html>
<html lang="en" style="color-scheme: dark; background-color: #000000;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Career Copilot — private resume analysis, mock interviews, and job matching in one workspace."
    />
    <meta property="og:title" content="Career Copilot" />
    <meta
      property="og:description"
      content="Compare a resume with a job, practice interviews, and save job matches in one private workspace."
    />
    <meta property="og:image" content="https://careercopilotai.vercel.app/brand/career-copilot-dark.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Career Copilot" />
    <meta
      name="twitter:description"
      content="Compare a resume with a job, practice interviews, and save job matches in one private workspace."
    />
    <meta name="twitter:image" content="https://careercopilotai.vercel.app/brand/career-copilot-dark.png" />
    <link rel="icon" href="/brand/career-copilot-dark.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#000000");
        } catch {}
      })();
    </script>
    <title>Career Copilot</title>
  </head>
  <body style="background-color: #000000;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
